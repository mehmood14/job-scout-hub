services:
  postgres:
    image: postgres:17
    container_name: job-scout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout
      POSTGRES_DB: jobscout
    ports:
      - "5433:5432"
    volumes:
      - job_scout_postgres_data:/var/lib/postgresql/data

volumes:
  job_scout_postgres_data: